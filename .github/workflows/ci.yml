name: Python bundle

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-fast:
    name: Python fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements.txt --requirement requirements-dev.txt

      - name: Install Pyright
        run: npm install --global pyright@1.1.408

      - name: Validate Python bundle
        run: ./scripts/check_bundle.sh

  postgres-contract:
    name: PostgreSQL contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Validate PostgreSQL contract
        run: ./scripts/check_postgres_schema.sh

  image-smoke:
    name: Image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build and inspect container image
        run: |
          docker compose --env-file .env.example config --quiet
          docker build --tag review-agent:ci .
          bash ./scripts/check_image.sh review-agent:ci

  dependency-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Scan dependency vulnerabilities
        id: dependency-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          output: dependency-vulnerabilities.json
          version: v0.74.0

      - name: Retain dependency vulnerability report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-vulnerabilities-${{ github.sha }}
          path: dependency-vulnerabilities.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce dependency vulnerability policy
        if: ${{ always() }}
        env:
          SCAN_OUTCOME: ${{ steps.dependency-scan.outcome }}
        run: |
          test "$SCAN_OUTCOME" = success
          python3 scripts/check_trivy_report.py \
            --require-target "requirements.txt" \
            --require-target "install/package-lock.json" \
            --require-target "website/package-lock.json" \
            dependency-vulnerabilities.json

  required:
    name: CI / required
    if: ${{ always() }}
    needs: [python-fast, postgres-contract, image-smoke, dependency-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm required jobs passed
        env:
          PYTHON_FAST_RESULT: ${{ needs.python-fast.result }}
          POSTGRES_RESULT: ${{ needs.postgres-contract.result }}
          IMAGE_RESULT: ${{ needs.image-smoke.result }}
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
        run: |
          test "$PYTHON_FAST_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$IMAGE_RESULT" = success
          test "$DEPENDENCY_SCAN_RESULT" = success
