version: 2

goal:
  title: "GitHub App pilot"
  slug: "github-app-pilot"
  kind: specific
  tranche: "Complete and validate one GitHub-App-only deployment candidate before the first end-to-end CCimen/review-agent pilot."
  status: active

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true

agents:
  scout: installed
  worker: installed
  judge: installed

continuity:
  rotate_threads: false
  rotation_authorized_by: null
  rotate_after_completed_write_tasks: 2
  rotate_after_hours: 6
  rotate_when_slow: true
  current_thread_id: null
  previous_thread_id: null
  rotation_count: 0
  completed_write_tasks_in_thread: 7
  handoff_note: notes/handoff.md
  last_handoff_at: null
  last_verified_revision: "343dace55be7947cba5ce4adac033bf7b906db9e"

active_task: T030

