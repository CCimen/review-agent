name: Python bundle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Install Pyright
        run: npm install --global pyright@1.1.408

      - name: Validate PostgreSQL schema
        run: ./scripts/check_postgres_schema.sh

      - name: Validate Python bundle
        run: ./scripts/check_bundle.sh

      - name: Build container image
        run: |
          docker compose --env-file .env.example config --quiet
          docker build --tag review-agent:ci .
          docker run --rm --entrypoint /usr/local/bin/review-agent-admission \
            review-agent:ci --help
          docker run --rm --entrypoint /usr/local/bin/review-agent-worker \
            review-agent:ci --help
          docker run --rm --entrypoint /usr/local/bin/review-agent-publisher \
            review-agent:ci --help
          docker run --rm --entrypoint /usr/local/bin/review-agent-hermes-contract \
            review-agent:ci
          docker run --rm --user 12345:0 \
            --tmpfs /opt/data:rw,mode=0770,uid=12345,gid=0 \
            --env HOME=/opt/data --env HERMES_HOME=/opt/data \
            --entrypoint /opt/hermes/bin/hermes review-agent:ci \
            gateway --help
