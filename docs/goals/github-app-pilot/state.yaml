        - "The migration is checksum-locked, atomic, previous-image tolerant, and backup/restore safe."
      non_goals:
        - "No GitHub network call, JWT, private key, token broker, or live App registration."
        - "No direct webhook path and no PAT/Actions deletion."
        - "No generic provider framework or policy engine."
      rollback: "Revert the code commit before any live installation state exists; the previous image already tolerates a database-ahead migration, and the new tables are additive."
