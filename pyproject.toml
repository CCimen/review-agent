# Build metadata and tool configuration. The wheel holds the package,
# src/review_agent, with its migrations and plugin manifest, and names the
# installed commands. Images install it without dependencies on top of the pins
# in requirements.txt and requirements/.

[build-system]
# Pinned like every other build input: the image builds fetch and run it.
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "review-agent"
# The release this source belongs to; a test keeps it equal to REVISION in
# scripts/generate_llms_docs.py, which the release workflow checks against the tag.
version = "0.5.0-rc.1"
description = "Self-hosted, advisory AI code review for GitHub pull requests"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE", "NOTICE.md"]
# What the stores, worker, admission, GitHub gateway and operator commands
# import. Lower bounds are the versions pinned today; images install the pins.
# pydantic has no root pin, the Hermes image provides it: its bound is the API.
dependencies = [
    "cryptography>=50.0.0",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "pydantic>=2",
    "PyJWT>=2.14.0",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
# The console API, and uvicorn, the server it is started with.
console = [
    "authlib>=1.9.8",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx2>=2.12.0",
    "joserfc>=1.7.5",
    "SQLAlchemy>=2.0.52",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]
# The runtime API the plugin registers inside the Hermes gateway.
hermes = ["aiohttp>=3.14.4"]

# One module in src/review_agent/cli per command. review-agent-memory is a
# historical name: it inspects stored records.
[project.scripts]
review-agent-admin = "review_agent.cli.admin:main"
review-agent-admission = "review_agent.cli.admission:main"
review-agent-code-graph = "review_agent.cli.code_graph:main"
review-agent-github-app-worker = "review_agent.cli.github_app_worker:main"
review-agent-github-gateway = "review_agent.cli.github_gateway:main"
review-agent-hermes-contract = "review_agent.cli.hermes_contract:main"
review-agent-memory = "review_agent.cli.records:main"
review-agent-publisher = "review_agent.cli.publisher:main"
review-agent-worker = "review_agent.cli.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["review_agent*"]
namespaces = false

[tool.setuptools.package-data]
review_agent = ["plugin.yaml", "postgres/migrations/*.sql"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.pyright]
include = [
    "src/review_agent",
    "hermes/install.py",
    "scripts/check_trivy_report.py",
    "scripts/generate_admin_openapi.py",
    "scripts/validate_release_tag.py",
    "scripts/write_build_info.py",
    "scripts/prepare_frontend_sbom.py",
]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
]
typeCheckingMode = "strict"
pythonVersion = "3.11"
pythonPlatform = "Linux"
reportImportCycles = "error"
reportMissingImports = "error"
reportMissingModuleSource = "error"
reportMissingTypeStubs = "error"
executionEnvironments = [
    { root = ".", extraPaths = ["src"] },
    { root = "src", extraPaths = ["src"] },
]
