_config_version: 33

group_sessions_per_user: true

# Raise this complete plugin-result budget for larger-context models if desired.
# Text pages are derived from it and continue by cursor, so it never limits total
# review depth. Diff and source page serializers enforce the configured value.
plugins:
  enabled:
    - review-agent-tools
  entries:
    review-agent-tools:
      settings:
        result_max_chars: 160000

# The deployment may override provider, model, and reasoning effort through
# REVIEW_AGENT_MODEL_PROVIDER, REVIEW_AGENT_MODEL, and
# REVIEW_AGENT_REASONING_EFFORT. The installer renders those values into this
# managed config so every review records one exact behavior contract.
# Authentication remains in Hermes' separate auth store.
model:
  provider: openai-codex
  default: gpt-5.6-sol

# The worker judges completion from PostgreSQL, not assistant prose. Keep
# progress messages out of API responses and logs used by operators.
display:
  tool_progress: 'off'
  interim_assistant_messages: false
  busy_ack_enabled: false
  long_running_notifications: false

# gpt-5.6 on the Codex OAuth route is hard-capped at a 272K context window, and the
# global compression default (0.50) compacts at ~136K — half the usable window. That
# caused frequent mid-review compaction and its noisy "Compacting context" /
# "Session compressed" PR comments on larger PRs. Set the trigger to 0.80 (~218K) so
# normal and medium reviews never compact; only genuinely huge PRs (>~218K) compact,
# which is acceptable for them and keeps more context (less lossy). Keep
# legacy codex_gpt55_autoraise setting off so its per-review "raised to 85%" notice
# never posts as a comment — this explicit threshold gives the same high trigger
# without that notice.
# (The gateway session-hygiene safety net stays fixed at 85%.)
compression:
  threshold: 0.80
  codex_gpt55_autoraise: false

terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 60
  home_mode: profile

# The webhook review gets only the purpose-built PR tools plus the narrow
# deterministic publisher. Hermes logs the final agent receipt; it does not post
# the model's final text through generic github_comment delivery.
platform_toolsets:
  cli:
    - review_agent
  api_server:
    - review_agent

agent:
  reasoning_effort: xhigh
  disabled_toolsets:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - debugging
    - delegation
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - file
    - homeassistant
    - image_gen
    - kanban
    - memory
    - messaging
    - moa
    - safe
    - search
    - session_search
    - skills
    - spotify
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao

memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true

skills:
  guard_agent_created: true
  write_approval: true

checkpoints:
  enabled: false

sessions:
  auto_prune: true
  retention_days: 30
  vacuum_after_prune: true
  min_interval_hours: 24

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

tool_output:
  max_bytes: 160000
  max_lines: 3000
  max_line_length: 3000
