schema_version: 2

deployment:
  environment: pilot
  platform: compose
  public_url: https://review.example.org
  image:
    repository: ghcr.io/ccimen/review-agent
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  profile: default-standard
  model_provider: openai-codex
  model: gpt-5.6-sol
  reasoning_effort: xhigh
  timezone: UTC
  advisory_only: true
  feedback_enabled: true

github:
  owner: example-org
  owner_type: organization
  installation_mode: organization_managed
  repositories: []

runtime:
  worker_replicas: 1
  worker_concurrency: 1
  active_job_limit: 20
  publication_replicas: 1

operations:
  backups:
    enabled: true
    owner: review-agent-operator

# Copy this file before editing it. Replace the example URL, image digest,
# owner, activation mode, any explicit repositories, and backup owner. Secrets
# belong in the deployment platform, never in this installation plan.
