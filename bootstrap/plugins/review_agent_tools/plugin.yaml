name: review-agent-tools
version: 2.1.0
description: Bounded GitHub PR context plus durable PostgreSQL review state
provides_tools:
  - review_agent_begin
  - review_agent_pr_diff
  - review_agent_pr_files
  - review_agent_pr_file
  - review_agent_memory_context
  - review_agent_memory_record
  - review_agent_deliver
requires_env:
  - name: REVIEW_AGENT_DATABASE_URL
    description: PostgreSQL connection URL for the shared review database
    secret: true
  - name: REVIEW_AGENT_GITHUB_GATEWAY_URL
    description: Private Review Agent GitHub gateway origin for App-backed source and publication operations
    secret: false
