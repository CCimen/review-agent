# Optional operator panel. Include this file alongside compose.yaml.
services:
  review-admin:
    image: ${REVIEW_AGENT_ADMIN_IMAGE:-review-agent-admin:local}
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    environment:
      REVIEW_AGENT_DATABASE_URL: "${REVIEW_AGENT_RUNTIME_DATABASE_URL:?set REVIEW_AGENT_RUNTIME_DATABASE_URL}"
      REVIEW_AGENT_ADMIN_PUBLIC_URL: "${REVIEW_AGENT_ADMIN_PUBLIC_URL:?set REVIEW_AGENT_ADMIN_PUBLIC_URL}"
      REVIEW_AGENT_GITHUB_APP_ID: "${REVIEW_AGENT_GITHUB_APP_ID:?set REVIEW_AGENT_GITHUB_APP_ID}"
      REVIEW_AGENT_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app-private-key.pem
      REVIEW_AGENT_PROFILE: "${REVIEW_AGENT_PROFILE:-default-standard}"
      REVIEW_AGENT_DOKPLOY_URL: "${REVIEW_AGENT_DOKPLOY_URL:-}"
      REVIEW_AGENT_DOKPLOY_API_KEY: "${REVIEW_AGENT_DOKPLOY_API_KEY:-}"
      REVIEW_AGENT_DOKPLOY_COMPOSE_ID: "${REVIEW_AGENT_DOKPLOY_COMPOSE_ID:-}"
      # Bootstrap values are used until an administrator saves a policy.
      REVIEW_AGENT_ACTIVE_JOB_LIMIT: "${REVIEW_AGENT_ACTIVE_JOB_LIMIT:-100}"
      REVIEW_AGENT_GITHUB_APP_CAPACITY_RETRY_SECONDS: "${REVIEW_AGENT_GITHUB_APP_CAPACITY_RETRY_SECONDS:-300}"
      REVIEW_AGENT_WORKER_CONCURRENCY: "${REVIEW_AGENT_WORKER_CONCURRENCY:-4}"
      REVIEW_AGENT_JOB_MAX_ATTEMPTS: "${REVIEW_AGENT_JOB_MAX_ATTEMPTS:-3}"
      REVIEW_AGENT_JOB_LEASE_SECONDS: "${REVIEW_AGENT_JOB_LEASE_SECONDS:-120}"
      REVIEW_AGENT_JOB_HEARTBEAT_SECONDS: "${REVIEW_AGENT_JOB_HEARTBEAT_SECONDS:-30}"
      REVIEW_AGENT_HERMES_TIMEOUT_SECONDS: "${REVIEW_AGENT_HERMES_TIMEOUT_SECONDS:-7200}"
      REVIEW_AGENT_PUBLISH_MAX_BYTES: "${REVIEW_AGENT_PUBLISH_MAX_BYTES:-60000}"
      REVIEW_AGENT_PUBLICATION_MAX_ATTEMPTS: "${REVIEW_AGENT_PUBLICATION_MAX_ATTEMPTS:-3}"
      REVIEW_AGENT_FEEDBACK_ENABLED: "${REVIEW_AGENT_FEEDBACK_ENABLED:-false}"
      REVIEW_AGENT_CODE_GRAPH_ENABLED: "${REVIEW_AGENT_CODE_GRAPH_ENABLED:-false}"
      REVIEW_AGENT_CODE_GRAPH_EMBEDDINGS: "${REVIEW_AGENT_CODE_GRAPH_EMBEDDINGS:-none}"
      REVIEW_AGENT_MODEL_PROVIDER: "${REVIEW_AGENT_MODEL_PROVIDER:-openai-codex}"
      REVIEW_AGENT_MODEL: "${REVIEW_AGENT_MODEL:-gpt-5.6-sol}"
      REVIEW_AGENT_REASONING_EFFORT: "${REVIEW_AGENT_REASONING_EFFORT:-xhigh}"
    depends_on:
      review-db-migrate:
        condition: service_completed_successfully
      review-postgres:
        condition: service_healthy
    expose:
      - "8090"
    networks:
      - review-database
      - review-ingress
      - review-github-egress
    secrets:
      - source: github_app_private_key
        target: github-app-private-key.pem
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${REVIEW_AGENT_INGRESS_NETWORK:-dokploy-network}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 64
    logging:
      options:
        max-size: "10m"
        max-file: "3"
