<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, system-ui, sans-serif">
  <title id="title">Compose topology</title>
  <desc id="desc">Only admission and the optional console sit behind the reverse proxy. GitHub sends webhooks to admission; operators sign in to the console, which also mounts the App key and calls GitHub. The App worker, publisher, Hermes, and review worker reach GitHub only through the private gateway, which holds the App key and requests installation tokens. Hermes alone calls the model provider, for review inference. The review worker calls Hermes on the runtime network. Every service shown connects to PostgreSQL on the internal database network.</desc>
  <style>
    svg { --bg: #f7f9fb; --panel: #ffffff; --line: #c4cad3; --text: #1f1f25; --muted: #555a64; --accent: #005595; --soft: #e7f0f7; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #202026; --panel: #18181c; --line: #4b4b57; --text: #f5f5f6; --muted: #b6b9c3; --accent: #69b3e7; --soft: #1c3346; }
    }
    .bg { fill: var(--bg); stroke: var(--line); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .optional { fill: var(--panel); stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .external { fill: var(--panel); stroke: var(--text); stroke-width: 1.5; }
    .key { fill: var(--soft); stroke: var(--accent); stroke-width: 1.5; }
    .zone { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 2 4; }
    .db { fill: var(--soft); stroke: var(--line); stroke-width: 1.5; }
    .flow { stroke: var(--accent); stroke-width: 2; fill: none; }
    .net { stroke: var(--muted); stroke-width: 2; fill: none; }
    .dot { fill: var(--muted); }
    .head { fill: var(--accent); }
    .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: var(--muted); }
    .title { font-size: 15px; font-weight: 700; fill: var(--text); }
    .body { font-size: 13px; fill: var(--muted); }
    .edge { font-size: 12px; fill: var(--accent); }
    .netlabel { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="759" height="469" rx="12"/>

  <!-- Outside the deployment -->
  <rect class="external" x="16" y="16" width="120" height="48" rx="8"/>
  <text class="title" x="76" y="45" text-anchor="middle">Operators</text>
  <rect class="external" x="220" y="16" width="300" height="48" rx="8"/>
  <text class="title" x="370" y="37" text-anchor="middle">GitHub</text>
  <text class="body" x="370" y="55" text-anchor="middle">webhooks in · API calls out</text>
  <rect class="external" x="572" y="16" width="160" height="48" rx="8"/>
  <text class="title" x="652" y="45" text-anchor="middle">Model provider</text>

  <!-- Reverse proxy -->
  <rect class="zone" x="16" y="84" width="384" height="108" rx="10"/>
  <rect class="optional" x="28" y="98" width="180" height="56" rx="8"/>
  <text class="title" x="40" y="120">Console</text>
  <text class="body" x="40" y="142">optional · holds App key</text>
  <rect class="box" x="220" y="98" width="168" height="56" rx="8"/>
  <text class="title" x="232" y="120">Admission</text>
  <text class="body" x="232" y="142">review-admission:8644</text>
  <text class="kicker" x="28" y="180">REVERSE PROXY · PUBLIC ROUTES</text>

  <line class="flow" x1="76" y1="64" x2="76" y2="96" marker-end="url(#arrow)"/>
  <text class="edge" x="84" y="82">sign-in</text>
  <path class="flow" d="M196 98V76H232V66" marker-end="url(#arrow)"/>
  <line class="flow" x1="280" y1="64" x2="280" y2="96" marker-end="url(#arrow)"/>
  <text class="edge" x="288" y="82">webhooks</text>

  <!-- Private networks -->
  <rect class="zone" x="16" y="204" width="728" height="226" rx="10"/>
  <text class="kicker" x="28" y="224">PRIVATE NETWORKS · NO INBOUND ROUTE</text>

  <rect class="box" x="28" y="234" width="140" height="56" rx="8"/>
  <text class="title" x="40" y="256">App worker</text>
  <text class="body" x="40" y="278">checks requests</text>
  <rect class="box" x="182" y="234" width="140" height="56" rx="8"/>
  <text class="title" x="194" y="256">Publisher</text>
  <text class="body" x="194" y="278">posts reviews</text>
  <rect class="key" x="360" y="234" width="180" height="56" rx="8"/>
  <text class="title" x="372" y="256">GitHub gateway</text>
  <text class="body" x="372" y="278">holds the App key</text>
  <rect class="box" x="572" y="234" width="160" height="56" rx="8"/>
  <text class="title" x="584" y="256">Hermes</text>
  <text class="body" x="584" y="278">model session · :8642</text>

  <line class="flow" x1="460" y1="234" x2="460" y2="66" marker-end="url(#arrow)"/>
  <text class="edge" x="468" y="150">installation tokens</text>
  <line class="flow" x1="652" y1="234" x2="652" y2="66" marker-end="url(#arrow)"/>
  <text class="edge" x="660" y="150">review inference</text>

  <!-- GitHub control network -->
  <path class="net" d="M98 318H640"/>
  <line class="net" x1="98" y1="290" x2="98" y2="318"/>
  <line class="net" x1="252" y1="290" x2="252" y2="318"/>
  <line class="net" x1="450" y1="290" x2="450" y2="318"/>
  <line class="net" x1="620" y1="290" x2="620" y2="318"/>
  <line class="net" x1="640" y1="346" x2="640" y2="318"/>
  <circle class="dot" cx="98" cy="318" r="3.5"/>
  <circle class="dot" cx="252" cy="318" r="3.5"/>
  <circle class="dot" cx="450" cy="318" r="3.5"/>
  <circle class="dot" cx="620" cy="318" r="3.5"/>
  <circle class="dot" cx="640" cy="318" r="3.5"/>
  <text class="netlabel" x="270" y="310">review-github-control</text>

  <!-- Runtime network -->
  <line class="flow" x1="712" y1="346" x2="712" y2="292" marker-end="url(#arrow)"/>
  <text class="edge" x="652" y="338">runtime</text>

  <rect class="db" x="28" y="346" width="512" height="56" rx="8"/>
  <text class="title" x="40" y="370">PostgreSQL</text>
  <text class="body" x="40" y="390">state and queues · every service shown connects over review-database</text>
  <rect class="box" x="572" y="346" width="160" height="56" rx="8"/>
  <text class="title" x="584" y="368">Review worker</text>
  <text class="body" x="584" y="390">runs review jobs</text>

  <text class="body" x="28" y="456">Arrows point from the side that opens the connection.</text>
</svg>
