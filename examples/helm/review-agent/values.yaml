# Required. An immutable image reference from the release's IMAGE-DIGESTS.txt,
# for example ghcr.io/ccimen/review-agent@sha256:<release-manifest-digest>.
image: ""
# Required. A model the provider account offers.
model: ""
# openai-codex or anthropic.
modelProvider: openai-codex
reasoningEffort: xhigh
profile: default-standard
# Accept /review false-positive, intentional and feedback commands.
feedbackEnabled: false

# Concurrent reviews per worker pod.
workerConcurrency: 4
workerReplicas: 1
publisherReplicas: 1
# Must exceed the longest drain a worker needs before it is force-terminated.
workerTerminationGraceSeconds: 150

# Deployment runs in three phases; docs/DEPLOYMENT.md has the script.
# drained scales every workload to zero. initialize runs the profile and
# migration Jobs and is only allowed while drained, so they never run beside
# the workloads.
drained: false
initialize: false

# Hermes configuration, model credentials and the installed review profile.
# The claim is kept when the release is uninstalled.
persistence:
  size: 5Gi
  # Hermes and the review workers share this volume. With ReadWriteOnce the
  # chart schedules the workers on the Hermes node; set ReadWriteMany when the
  # storage class supports it and the pods should spread across nodes.
  accessMode: ReadWriteOnce
  # Empty uses the cluster's default storage class.
  storageClassName: ""

# The image starts as root unless told otherwise. OpenShift assigns a user
# itself: there, keep only seccompProfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10000
  runAsGroup: 10000
  fsGroup: 10000
  seccompProfile:
    type: RuntimeDefault

# Public route for GitHub webhooks. Only the admission service is exposed.
ingress:
  enabled: false
  className: ""
  host: ""
  # Secret holding the TLS certificate for the host; empty leaves TLS to the
  # ingress controller's default.
  tlsSecretName: ""
  annotations: {}
