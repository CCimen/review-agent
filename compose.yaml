services:
  review-postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: review_agent
      POSTGRES_USER: review_agent
      POSTGRES_PASSWORD: "${REVIEW_AGENT_POSTGRES_PASSWORD:?set REVIEW_AGENT_POSTGRES_PASSWORD}"
    volumes:
      - review_postgres_data:/var/lib/postgresql/data
    networks:
      - review-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_agent -d review_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  review-profile-install:
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: "no"
    entrypoint: ["/opt/review-agent-bootstrap/install.sh"]
    command: ["--force-agents"]
    environment:
      HERMES_HOME: /opt/data
      REVIEW_AGENT_PROFILE: "${REVIEW_AGENT_PROFILE:-sundsvall-standard}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - hermes_review_data:/opt/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m

  review-db-migrate:
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: "no"
    user: "10000:10000"
    entrypoint: ["/usr/local/bin/review-agent-database"]
    command: ["migrate"]
    depends_on:
      review-postgres:
        condition: service_healthy
    environment:
      REVIEW_AGENT_DATABASE_URL: "${REVIEW_AGENT_DATABASE_URL:?set REVIEW_AGENT_DATABASE_URL}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      - review-database
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m

  hermes-review:
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: unless-stopped
    command: gateway run
    depends_on:
      review-profile-install:
        condition: service_completed_successfully
      review-db-migrate:
        condition: service_completed_successfully
    environment:
      TZ: "${TZ:-Europe/Stockholm}"
      WEBHOOK_ENABLED: "${WEBHOOK_ENABLED:-true}"
      WEBHOOK_PORT: "${WEBHOOK_PORT:-8644}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:?set WEBHOOK_SECRET}"
      GH_PROMPT_DISABLED: "${GH_PROMPT_DISABLED:-1}"
      GITHUB_READ_TOKEN: "${GITHUB_READ_TOKEN:?set GITHUB_READ_TOKEN}"
      REVIEW_AGENT_PUBLISH_GH_TOKEN: "${REVIEW_AGENT_PUBLISH_GH_TOKEN:?set REVIEW_AGENT_PUBLISH_GH_TOKEN}"
      REVIEW_AGENT_PUBLISH_MAX_BYTES: "${REVIEW_AGENT_PUBLISH_MAX_BYTES:-60000}"
      REVIEW_AGENT_ALLOWED_REPOSITORIES: "${REVIEW_AGENT_ALLOWED_REPOSITORIES:?set REVIEW_AGENT_ALLOWED_REPOSITORIES}"
      REVIEW_AGENT_DATABASE_URL: "${REVIEW_AGENT_DATABASE_URL:?set REVIEW_AGENT_DATABASE_URL}"
      REVIEW_AGENT_FEEDBACK_ENABLED: "${REVIEW_AGENT_FEEDBACK_ENABLED:-false}"
      HERMES_DASHBOARD: "${HERMES_DASHBOARD:-0}"
      API_SERVER_ENABLED: "${API_SERVER_ENABLED:-false}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8644"
    networks:
      - dokploy-network
      - review-database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
    volumes:
      - hermes_review_data:/opt/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8644/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "2.0"
          pids: 256
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  hermes-review-feedback:
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: unless-stopped
    user: "10000:10000"
    entrypoint: ["/usr/local/bin/review-agent-feedback-bridge"]
    command: ["serve", "--host", "0.0.0.0", "--port", "8645"]
    depends_on:
      review-db-migrate:
        condition: service_completed_successfully
    environment:
      TZ: "${TZ:-Europe/Stockholm}"
      REVIEW_AGENT_DATABASE_URL: "${REVIEW_AGENT_DATABASE_URL:?set REVIEW_AGENT_DATABASE_URL}"
      REVIEW_AGENT_FEEDBACK_WEBHOOK_SECRET: "${REVIEW_AGENT_FEEDBACK_WEBHOOK_SECRET:?set REVIEW_AGENT_FEEDBACK_WEBHOOK_SECRET}"
      REVIEW_AGENT_FEEDBACK_GH_TOKEN: "${REVIEW_AGENT_FEEDBACK_GH_TOKEN:?set REVIEW_AGENT_FEEDBACK_GH_TOKEN}"
      REVIEW_AGENT_ALLOWED_REPOSITORIES: "${REVIEW_AGENT_ALLOWED_REPOSITORIES:?set REVIEW_AGENT_ALLOWED_REPOSITORIES}"
      REVIEW_AGENT_FEEDBACK_ALLOWED_ACTOR_IDS: "${REVIEW_AGENT_FEEDBACK_ALLOWED_ACTOR_IDS:?set REVIEW_AGENT_FEEDBACK_ALLOWED_ACTOR_IDS}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8645"
    networks:
      - dokploy-network
      - review-database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8645/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
          pids: 64
    logging:
      options:
        max-size: "10m"
        max-file: "5"

networks:
  dokploy-network:
    external: true
  review-database:
    internal: true

volumes:
  hermes_review_data:
  review_postgres_data:
