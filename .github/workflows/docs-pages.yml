name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-pages.yml'
      - 'docs/**'
      - '!docs/goals/**'
      - 'examples/comments/**'
      - 'scripts/check_docs.py'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Install dependencies
        run: npm --prefix website ci

      - name: Validate public documentation
        run: python3 scripts/check_docs.py

      - name: Type-check the site
        run: npm --prefix website run typecheck

      - name: Build the site
        run: npm --prefix website run build

      - name: Verify published routes
        run: python3 scripts/check_docs.py --build-dir website/build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: website/build

  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
