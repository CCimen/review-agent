_config_version: 39

group_sessions_per_user: true

# Operator ceiling for one plugin result and for the shares of one model response.
# Each session is further held to the per-result and per-turn budgets Hermes
# derives from its model's context window. Text pages are derived from this value
# and continue by cursor, so it never limits total review depth.
plugins:
  enabled:
    - review-agent-tools
  entries:
    review-agent-tools:
      settings:
        result_max_chars: 160000

# The deployment must name the review model in REVIEW_AGENT_MODEL and may
# override provider and reasoning effort through REVIEW_AGENT_MODEL_PROVIDER and
# REVIEW_AGENT_REASONING_EFFORT. The installer renders those values into this
# managed config so every review records one exact behavior contract; the
# placeholder below is never used as a model. Authentication remains in Hermes'
# separate auth store.
model:
  provider: openai-codex
  default: set-by-REVIEW_AGENT_MODEL

# Admission freezes one provider account. Provider changes require a new review;
# no implicit fallback may choose a different account after dispatch.
fallback_providers: []
fallback_model: null
auxiliary:
  allow_fallback: false

# The worker judges completion from PostgreSQL, not assistant prose. Keep
# progress messages out of API responses and logs used by operators.
display:
  tool_progress: 'off'
  interim_assistant_messages: false
  busy_ack_enabled: false
  long_running_notifications: false

# Hermes' default compression threshold (0.50) compacts at half the context window,
# which caused frequent mid-review compaction and noisy "Compacting context" PR
# comments. 0.80 keeps normal and medium reviews uncompacted. Keep the legacy
# codex_gpt55_autoraise setting off so its "raised to 85%" notice never posts as a
# comment. Review parts are sized from window x threshold, so this block sets no
# per-model thresholds or absolute token caps, and model sets no max_tokens output
# reservation. (The gateway session-hygiene safety net stays fixed at 85%.)
compression:
  threshold: 0.80
  codex_gpt55_autoraise: false

terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 60
  home_mode: profile

# The webhook review gets only the purpose-built PR tools plus the narrow
# deterministic publisher. Hermes logs the final agent receipt; it does not post
# the model's final text through generic github_comment delivery.
platform_toolsets:
  cli:
    - review_agent
  api_server:
    - review_agent

agent:
  reasoning_effort: xhigh
  # Each model call retries with jittered backoff (2 s doubling to 60 s). The
  # default of 3 gave up after about 15 s, and a provider overload then discarded
  # the whole session; 8 rides out about 3-4.5 minutes before the turn fails.
  api_max_retries: 8
  disabled_toolsets:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - debugging
    - delegation
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - file
    - homeassistant
    - image_gen
    - kanban
    - memory
    - messaging
    - moa
    - safe
    - search
    - session_search
    - skills
    - spotify
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao

memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true

skills:
  guard_agent_created: true
  write_approval: true

checkpoints:
  enabled: false

sessions:
  auto_prune: true
  retention_days: 30
  vacuum_after_prune: true
  min_interval_hours: 24

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

tool_output:
  max_bytes: 160000
  max_lines: 3000
  max_line_length: 3000
