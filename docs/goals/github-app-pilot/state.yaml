    constraints:
      - "Do not implement."
      - "Reject a private key in Hermes and reject a generic credential framework."
      - "Keep the live PAT route unchanged in this foundation slice."
    expected_output:
      - "Decision"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Deferred cutover tasks"
    receipt:
      result: done
      decision: "Deepen the PostgreSQL repository registry with one installation and activation lifecycle first. Store queryable lifecycle facts in relational columns, keep repository identity in registry.py, and defer token signing and webhook delivery to later commits."
