name: Publish container image

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Record verified source
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/validate_release_tag.py "$RELEASE_TAG"

      - name: Confirm release documentation revision
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/generate_llms_docs.py --check
          if ! grep -Fxq "Release state: ${RELEASE_TAG}" website/static/llms.txt; then
            echo "Generated LLM documentation does not match the release tag." >&2
            exit 1
          fi

  quality:
    name: Canonical quality
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [verify, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false

      - name: Confirm release tag still targets verified source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/release-candidate"
          test "$(git rev-list -n 1 refs/tags/release-candidate)" = "$SOURCE_SHA"

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  evidence:
    name: Generate and scan release evidence
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out verified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
        with:
          syft-version: v1.51.1

      - name: Generate release inventories
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          CYCLONEDX_SPEC_VERSION: "1.7"
        run: |
          scripts/generate_release_sbom.sh \
            "$IMAGE_NAME" "$RELEASE_TAG" release-sbom

      - name: Record release platform digests
        run: |
          mkdir -p vulnerability-reports
          amd64_image="$(awk '$2 == "linux/amd64" {print $4}' \
            release-sbom/IMAGE-DIGESTS.txt)"
          arm64_image="$(awk '$2 == "linux/arm64" {print $4}' \
            release-sbom/IMAGE-DIGESTS.txt)"
          test -n "$amd64_image"
          test -n "$arm64_image"
          echo "AMD64_IMAGE=${amd64_image}" >> "$GITHUB_ENV"
          echo "ARM64_IMAGE=${arm64_image}" >> "$GITHUB_ENV"

      - name: Smoke exact linux/amd64 release image
        run: bash ./scripts/check_image.sh "$AMD64_IMAGE"

      - name: Scan linux/amd64 image vulnerabilities
        id: scan-amd64
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.AMD64_IMAGE }}
          trivy-config: trivy.yaml
          output: vulnerability-reports/vulnerability-linux-amd64.json
          version: v0.74.0

      - name: Scan linux/arm64 image vulnerabilities
        id: scan-arm64
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.ARM64_IMAGE }}
          trivy-config: trivy.yaml
          output: vulnerability-reports/vulnerability-linux-arm64.json
          version: v0.74.0
          skip-setup-trivy: true

      - name: Retain image vulnerability reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-vulnerabilities-${{ github.event.release.tag_name }}
          path: vulnerability-reports/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce image vulnerability policy
        if: ${{ always() }}
        env:
          AMD64_SCAN_OUTCOME: ${{ steps.scan-amd64.outcome }}
          ARM64_SCAN_OUTCOME: ${{ steps.scan-arm64.outcome }}
        run: |
          test "$AMD64_SCAN_OUTCOME" = success
          test "$ARM64_SCAN_OUTCOME" = success
          python3 scripts/check_trivy_report.py \
            --critical-exceptions release-image-critical-exceptions.json \
            --markdown-output release-sbom/VULNERABILITY-SUMMARY.md \
            vulnerability-reports/vulnerability-linux-amd64.json \
            vulnerability-reports/vulnerability-linux-arm64.json \
            | tee release-sbom/VULNERABILITY-POLICY.json

      - name: Add scan reports to release evidence
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > release-sbom/SOURCE-SHA.txt
          cp vulnerability-reports/*.json release-sbom/
          (
            cd release-sbom
            sha256sum -- SOURCE-SHA.txt VULNERABILITY-POLICY.json \
              VULNERABILITY-SUMMARY.md vulnerability-*.json \
              >> SBOM-SHA256SUMS.txt
          )

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-sbom-${{ github.event.release.tag_name }}
          path: release-sbom/*
          if-no-files-found: error

  sbom:
    name: Attest and attach release evidence
    needs: [verify, publish, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      # This job consumes verified artifacts without a checkout, so gh cannot
      # infer the repository from a local .git directory.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-sbom-${{ github.event.release.tag_name }}
          path: release-sbom
          digest-mismatch: error

      - name: Verify release evidence
        env:
          EXPECTED_IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          expected_files=(
            IMAGE-DIGESTS.txt
            SBOM-SHA256SUMS.txt
            SOURCE-SHA.txt
            VULNERABILITY-POLICY.json
            VULNERABILITY-SUMMARY.md
            "review-agent-${RELEASE_TAG}-linux-amd64.cyclonedx.json"
            "review-agent-${RELEASE_TAG}-linux-amd64.spdx.json"
            "review-agent-${RELEASE_TAG}-linux-amd64.table.txt"
            "review-agent-${RELEASE_TAG}-linux-arm64.cyclonedx.json"
            "review-agent-${RELEASE_TAG}-linux-arm64.spdx.json"
            "review-agent-${RELEASE_TAG}-linux-arm64.table.txt"
            "review-agent-python-runtime-${RELEASE_TAG}-linux-amd64.cyclonedx.json"
            vulnerability-linux-amd64.json
            vulnerability-linux-arm64.json
          )
          checksum_files=(
            IMAGE-DIGESTS.txt
            SOURCE-SHA.txt
            "${expected_files[@]:3}"
          )
          diff -u \
            <(printf '%s\n' "${expected_files[@]}" | LC_ALL=C sort) \
            <(
              for path in release-sbom/* release-sbom/.[!.]* release-sbom/..?*; do
                if [[ -e "$path" || -L "$path" ]]; then
                  printf '%s\n' "${path##*/}"
                fi
              done | LC_ALL=C sort
            )

          checksum_manifest=release-sbom/SBOM-SHA256SUMS.txt
          if grep -Ev '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' \
            "$checksum_manifest" >/dev/null; then
            echo "Release evidence checksum manifest is malformed." >&2
            exit 1
          fi
          diff -u \
            <(printf '%s\n' "${checksum_files[@]}" | LC_ALL=C sort) \
            <(cut -d ' ' -f3 "$checksum_manifest" | LC_ALL=C sort)

          test "$(cat release-sbom/SOURCE-SHA.txt)" = "$SOURCE_SHA"
          [[ "$EXPECTED_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          repository="$(printf '%s' "$GITHUB_REPOSITORY" \
            | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/$repository"
          digest_lines=()
          while IFS= read -r line; do
            digest_lines+=("$line")
          done < release-sbom/IMAGE-DIGESTS.txt
          test "${#digest_lines[@]}" -eq 3
          test "${digest_lines[0]}" = \
            "review-agent manifest ${image_name}:${RELEASE_TAG} ${image_name}@${EXPECTED_IMAGE_DIGEST}"
          for index_and_architecture in "1 amd64" "2 arm64"; do
            read -r index architecture <<<"$index_and_architecture"
            prefix="review-agent linux/${architecture} ${image_name}:${RELEASE_TAG} ${image_name}@sha256:"
            [[ "${digest_lines[$index]}" == "$prefix"* ]]
            digest="${digest_lines[$index]#"$prefix"}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done
          (
            cd release-sbom
            sha256sum --check SBOM-SHA256SUMS.txt
          )

      - name: Attest release inventories
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-sbom/*

      - name: Attach inventories to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-sbom/* --clobber

      - name: Update release vulnerability summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body \
            > release-body-current.md
          awk -v summary_file="release-sbom/VULNERABILITY-SUMMARY.md" '
            {
              lines[NR] = $0
              if ($0 == "<!-- review-agent-vulnerability-summary:start -->") {
                if (found_start || skip) invalid = 1
                found_start = 1
                start_line = NR
                skip = 1
                next
              }
              if ($0 == "<!-- review-agent-vulnerability-summary:end -->") {
                if (!skip || found_end) invalid = 1
                found_end = 1
                end_line = NR
                skip = 0
              }
            }
            function print_summary(    line, status) {
              while ((status = getline line < summary_file) > 0) print line
              if (status < 0) invalid = 1
              close(summary_file)
            }
            END {
              if (invalid || skip || found_start != found_end) exit 1
              if (found_start) {
                for (line_number = 1; line_number < start_line; line_number++) {
                  print lines[line_number]
                }
                print_summary()
                for (line_number = end_line + 1; line_number <= NR; line_number++) {
                  print lines[line_number]
                }
                if (invalid) exit 1
                exit
              }

              last = NR
              while (last > 0 && lines[last] ~ /^[[:space:]]*$/) last--
              for (line_number = 1; line_number <= last; line_number++) {
                print lines[line_number]
              }
              if (last > 0) print ""
              print_summary()
              if (invalid) exit 1
            }
          ' release-body-current.md > release-body-updated.md
          gh release edit "$RELEASE_TAG" --notes-file release-body-updated.md
