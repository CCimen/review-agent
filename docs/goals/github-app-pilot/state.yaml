    status: done
    reasoning_hint: high
    objective: "Map the current GitHub admission, source-read, publication, repository-registry, job, configuration, deployment, and documentation owners against the supplied GitHub App proposal and official GitHub contracts."
    inputs:
      - "User-supplied organization-onboarding review and starter ZIP"
      - "bootstrap/plugins/review_agent_tools"
      - "bootstrap/plugins/review_agent_tools/postgres_migrations"
      - "tools"
      - "compose.yaml"
      - "docs"
      - "Official GitHub App and webhook documentation"
    constraints:
      - "Read-only."
      - "Treat supplied files as design input, not repository authority."
      - "Do not touch Sundsvallskommun resources."
      - "Identify reuse and deletion opportunities before new modules."
    expected_output:
