<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 516" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, system-ui, sans-serif">
  <title id="title">Compose topology</title>
  <desc id="desc">Only admission and the optional console sit behind the reverse proxy. GitHub sends webhooks to admission; operators sign in to the console, which also holds the App key and reads App status from GitHub. The App worker, publisher, review worker, and Hermes reach GitHub only through the private gateway, which holds the App key. The review worker starts sessions in Hermes, and Hermes alone calls the model provider, for review inference. Every service shown connects to PostgreSQL on the internal database network.</desc>
  <style>
    svg { --bg: #f7f9fb; --panel: #ffffff; --line: #c4cad3; --text: #1f1f25; --muted: #555a64; --accent: #005595; --soft: #e7f0f7; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #202026; --panel: #18181c; --line: #4b4b57; --text: #f5f5f6; --muted: #b6b9c3; --accent: #69b3e7; --soft: #1c3346; }
    }
    .bg { fill: var(--bg); stroke: var(--line); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .optional { fill: var(--panel); stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .external { fill: var(--panel); stroke: var(--text); stroke-width: 1.5; }
    .key { fill: var(--soft); stroke: var(--accent); stroke-width: 1.5; }
    .zone { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 2 4; }
    .db { fill: var(--soft); stroke: var(--line); stroke-width: 1.5; }
    .flow { stroke: var(--accent); stroke-width: 2; fill: none; }
    .head { fill: var(--accent); }
    .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: var(--muted); }
    .title { font-size: 15px; font-weight: 700; fill: var(--text); }
    .body { font-size: 13px; fill: var(--muted); }
    .edge { font-size: 12px; fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="759" height="515" rx="12"/>

  <!-- Outside the deployment -->
  <rect class="external" x="16" y="16" width="128" height="48" rx="8"/>
  <text class="title" x="80" y="45" text-anchor="middle">Operators</text>
  <rect class="external" x="164" y="16" width="356" height="48" rx="8"/>
  <text class="title" x="342" y="37" text-anchor="middle">GitHub</text>
  <text class="body" x="342" y="55" text-anchor="middle">webhooks in · API calls out</text>
  <rect class="external" x="572" y="16" width="160" height="48" rx="8"/>
  <text class="title" x="652" y="45" text-anchor="middle">Model provider</text>

  <!-- Reverse proxy -->
  <rect class="zone" x="16" y="88" width="384" height="104" rx="10"/>
  <rect class="optional" x="28" y="98" width="180" height="56" rx="8"/>
  <text class="title" x="40" y="120">Console</text>
  <text class="body" x="40" y="142">optional · holds App key</text>
  <rect class="box" x="220" y="98" width="168" height="56" rx="8"/>
  <text class="title" x="232" y="120">Admission</text>
  <text class="body" x="232" y="142">review-admission:8644</text>
  <text class="kicker" x="28" y="180">REVERSE PROXY · PUBLIC ROUTES</text>

  <line class="flow" x1="80" y1="64" x2="80" y2="96" marker-end="url(#arrow)"/>
  <text class="edge" x="88" y="79">sign-in</text>
  <line class="flow" x1="188" y1="98" x2="188" y2="66" marker-end="url(#arrow)"/>
  <text class="edge" x="196" y="79">App status</text>
  <line class="flow" x1="300" y1="64" x2="300" y2="96" marker-end="url(#arrow)"/>
  <text class="edge" x="308" y="79">webhooks</text>

  <!-- Private networks -->
  <rect class="zone" x="16" y="204" width="728" height="268" rx="10"/>
  <text class="kicker" x="28" y="224">PRIVATE NETWORKS · NO INBOUND ROUTE</text>

  <rect class="key" x="28" y="234" width="492" height="56" rx="8"/>
  <text class="title" x="40" y="256">GitHub gateway</text>
  <text class="body" x="40" y="278">holds the App key · the only private route to GitHub</text>
  <rect class="box" x="572" y="234" width="160" height="56" rx="8"/>
  <text class="title" x="584" y="256">Hermes</text>
  <text class="body" x="584" y="278">model session · :8642</text>

  <line class="flow" x1="470" y1="234" x2="470" y2="66" marker-end="url(#arrow)"/>
  <text class="edge" x="478" y="150">GitHub API</text>
  <line class="flow" x1="652" y1="234" x2="652" y2="66" marker-end="url(#arrow)"/>
  <text class="edge" x="660" y="144">review</text>
  <text class="edge" x="660" y="160">inference</text>
  <line class="flow" x1="570" y1="262" x2="522" y2="262" marker-end="url(#arrow)"/>

  <rect class="box" x="28" y="320" width="140" height="56" rx="8"/>
  <text class="title" x="40" y="342">App worker</text>
  <text class="body" x="40" y="364">checks requests</text>
  <rect class="box" x="182" y="320" width="140" height="56" rx="8"/>
  <text class="title" x="194" y="342">Publisher</text>
  <text class="body" x="194" y="364">posts reviews</text>
  <rect class="box" x="360" y="320" width="160" height="56" rx="8"/>
  <text class="title" x="372" y="342">Review worker</text>
  <text class="body" x="372" y="364">runs review jobs</text>

  <line class="flow" x1="98" y1="320" x2="98" y2="292" marker-end="url(#arrow)"/>
  <line class="flow" x1="252" y1="320" x2="252" y2="292" marker-end="url(#arrow)"/>
  <line class="flow" x1="420" y1="320" x2="420" y2="292" marker-end="url(#arrow)"/>
  <path class="flow" d="M520 348H652V292" marker-end="url(#arrow)"/>
  <text class="edge" x="532" y="340">starts sessions</text>

  <rect class="db" x="28" y="400" width="704" height="56" rx="8"/>
  <text class="title" x="40" y="424">PostgreSQL</text>
  <text class="body" x="40" y="444">state and queues · every service shown connects to it</text>

  <text class="body" x="28" y="498">Arrows point from the side that opens the connection.</text>
</svg>
