name: review-agent-tools
version: 2.1.0
description: Bounded GitHub PR context plus human-curated SQLite finding memory
provides_tools:
  - review_agent_begin
  - review_agent_pr_diff
  - review_agent_pr_files
  - review_agent_pr_file
  - review_agent_memory_context
  - review_agent_memory_record
  - review_agent_deliver
requires_env:
  - name: REVIEW_AGENT_ALLOWED_REPOSITORIES
    description: Exact comma-separated GitHub repositories this plugin may read
    secret: false
  - name: GITHUB_READ_TOKEN
    description: Fine-grained GitHub token for bounded PR reads
    secret: true
  - name: REVIEW_AGENT_PUBLISH_GH_TOKEN
    description: Fine-grained GitHub token for deterministic summaries and native review suggestions
    secret: true
