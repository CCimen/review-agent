services:
  review-postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    command: ["postgres", "-c", "max_connections=${REVIEW_AGENT_POSTGRES_MAX_CONNECTIONS:-200}"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: review_agent
      POSTGRES_USER: review_agent
      POSTGRES_PASSWORD: "${REVIEW_AGENT_POSTGRES_PASSWORD:?set REVIEW_AGENT_POSTGRES_PASSWORD}"
    volumes:
      - review_postgres_data:/var/lib/postgresql/data
    networks:
      - review-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_agent -d review_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  review-profile-install:
    image: ${REVIEW_AGENT_IMAGE:-review-agent:local}
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: "no"
    entrypoint: ["/opt/review-agent-bootstrap/install.sh"]
    environment:
      HERMES_HOME: /opt/data
      REVIEW_AGENT_PROFILE: "${REVIEW_AGENT_PROFILE:-sundsvall-standard}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - hermes_review_data:/opt/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m

  review-db-migrate:
    image: ${REVIEW_AGENT_IMAGE:-review-agent:local}
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: "no"
    user: "10000:10000"
    entrypoint: ["/usr/local/bin/review-agent-database"]
    command: ["migrate"]
    depends_on:
      review-postgres:
        condition: service_healthy
    environment:
      REVIEW_AGENT_DATABASE_URL: "${REVIEW_AGENT_DATABASE_URL:?set REVIEW_AGENT_DATABASE_URL}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      - review-database
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m

  hermes-review:
    image: ${REVIEW_AGENT_IMAGE:-review-agent:local}
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: unless-stopped
    command: gateway run
    depends_on:
      review-profile-install:
        condition: service_completed_successfully
      review-db-migrate:
        condition: service_completed_successfully
      review-github-gateway:
        condition: service_healthy
    environment:
      TZ: "${TZ:-Europe/Stockholm}"
      WEBHOOK_ENABLED: "false"
      REVIEW_AGENT_GITHUB_GATEWAY_URL: "http://review-github-gateway:8646"
      REVIEW_AGENT_PUBLISH_MAX_BYTES: "${REVIEW_AGENT_PUBLISH_MAX_BYTES:-60000}"
      REVIEW_AGENT_PUBLICATION_MAX_ATTEMPTS: "${REVIEW_AGENT_PUBLICATION_MAX_ATTEMPTS:-3}"
      REVIEW_AGENT_DATABASE_URL: "${REVIEW_AGENT_DATABASE_URL:?set REVIEW_AGENT_DATABASE_URL}"
      REVIEW_AGENT_PROFILE: "${REVIEW_AGENT_PROFILE:-sundsvall-standard}"
      REVIEW_AGENT_FEEDBACK_ENABLED: "${REVIEW_AGENT_FEEDBACK_ENABLED:-false}"
      HERMES_DASHBOARD: "${HERMES_DASHBOARD:-0}"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${API_SERVER_KEY:?set API_SERVER_KEY}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8642"
    networks:
      - review-egress
      - review-database
      - review-runtime
      - review-github-control
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true
    volumes:
      - hermes_review_data:/opt/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "2.0"
          pids: 256
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  review-admission:
    image: ${REVIEW_AGENT_IMAGE:-review-agent:local}
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: unless-stopped
    user: "10000:10000"
    entrypoint: ["/usr/local/bin/review-agent-admission"]
    command: ["serve", "--host", "0.0.0.0", "--port", "8644"]
    depends_on:
      review-profile-install:
        condition: service_completed_successfully
      review-db-migrate:
        condition: service_completed_successfully
    environment:
      TZ: "${TZ:-Europe/Stockholm}"
      REVIEW_AGENT_GITHUB_APP_WEBHOOK_SECRET: "${REVIEW_AGENT_GITHUB_APP_WEBHOOK_SECRET:?set REVIEW_AGENT_GITHUB_APP_WEBHOOK_SECRET}"
      REVIEW_AGENT_DATABASE_URL: "${REVIEW_AGENT_DATABASE_URL:?set REVIEW_AGENT_DATABASE_URL}"
      REVIEW_AGENT_PROFILE: "${REVIEW_AGENT_PROFILE:-sundsvall-standard}"
      REVIEW_AGENT_GITHUB_APP_MAX_BODY_BYTES: "${REVIEW_AGENT_GITHUB_APP_MAX_BODY_BYTES:-2097152}"
      REVIEW_AGENT_ADMISSION_MAX_CONCURRENT_REQUESTS: "${REVIEW_AGENT_ADMISSION_MAX_CONCURRENT_REQUESTS:-8}"
      REVIEW_AGENT_ADMISSION_REQUEST_TIMEOUT_SECONDS: "${REVIEW_AGENT_ADMISSION_REQUEST_TIMEOUT_SECONDS:-30}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8644"
    networks:
      - review-ingress
      - review-database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${REVIEW_AGENT_INGRESS_NETWORK:-dokploy-network}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8644/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
          pids: 64
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  review-worker:
    image: ${REVIEW_AGENT_IMAGE:-review-agent:local}
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: unless-stopped
    user: "10000:10000"
    entrypoint: ["/usr/local/bin/review-agent-worker"]
    depends_on:
      review-db-migrate:
        condition: service_completed_successfully
      hermes-review:
        condition: service_healthy
    environment:
      REVIEW_AGENT_DATABASE_URL: "${REVIEW_AGENT_DATABASE_URL:?set REVIEW_AGENT_DATABASE_URL}"
      REVIEW_AGENT_HERMES_CHAT_URL: "http://hermes-review:8642/v1/chat/completions"
      API_SERVER_KEY: "${API_SERVER_KEY:?set API_SERVER_KEY}"
      REVIEW_AGENT_WORKER_CONCURRENCY: "${REVIEW_AGENT_WORKER_CONCURRENCY:-4}"
      REVIEW_AGENT_JOB_LEASE_SECONDS: "${REVIEW_AGENT_JOB_LEASE_SECONDS:-120}"
      REVIEW_AGENT_JOB_HEARTBEAT_SECONDS: "${REVIEW_AGENT_JOB_HEARTBEAT_SECONDS:-30}"
      REVIEW_AGENT_JOB_RETRY_SECONDS: "${REVIEW_AGENT_JOB_RETRY_SECONDS:-30}"
      REVIEW_AGENT_JOB_POLL_SECONDS: "${REVIEW_AGENT_JOB_POLL_SECONDS:-2}"
      REVIEW_AGENT_JOB_RECOVERY_SECONDS: "${REVIEW_AGENT_JOB_RECOVERY_SECONDS:-30}"
      REVIEW_AGENT_JOB_RECOVERY_BATCH_SIZE: "${REVIEW_AGENT_JOB_RECOVERY_BATCH_SIZE:-100}"
      REVIEW_AGENT_JOB_PRIORITY_AGING_SECONDS: "${REVIEW_AGENT_JOB_PRIORITY_AGING_SECONDS:-900}"
      REVIEW_AGENT_HERMES_TIMEOUT_SECONDS: "${REVIEW_AGENT_HERMES_TIMEOUT_SECONDS:-7200}"
      HERMES_HOME: /opt/data
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      - review-database
      - review-runtime
    volumes:
      - hermes_review_data:/opt/data:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    stop_grace_period: 150s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
          pids: 64
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  review-github-gateway:
    image: ${REVIEW_AGENT_IMAGE:-review-agent:local}
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: unless-stopped
    user: "10000:10000"
    entrypoint: ["/usr/local/bin/review-agent-github-gateway"]
    command: ["serve", "--host", "0.0.0.0", "--port", "8646"]
    depends_on:
      review-db-migrate:
        condition: service_completed_successfully
    environment:
      REVIEW_AGENT_DATABASE_URL: "${REVIEW_AGENT_DATABASE_URL:?set REVIEW_AGENT_DATABASE_URL}"
      REVIEW_AGENT_GITHUB_APP_ID: "${REVIEW_AGENT_GITHUB_APP_ID:?set REVIEW_AGENT_GITHUB_APP_ID}"
      REVIEW_AGENT_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app-private-key.pem
      # Eight worst-case changed-file responses stay within the 256 MiB service budget.
      REVIEW_AGENT_GITHUB_GATEWAY_MAX_CONCURRENT_REQUESTS: "${REVIEW_AGENT_GITHUB_GATEWAY_MAX_CONCURRENT_REQUESTS:-8}"
      REVIEW_AGENT_PROFILE: "${REVIEW_AGENT_PROFILE:-sundsvall-standard}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8646"
    networks:
      - review-github-egress
      - review-database
      - review-github-control
    secrets:
      - source: github_app_private_key
        target: github-app-private-key.pem
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8646/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
          pids: 64
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  review-github-app-worker:
    image: ${REVIEW_AGENT_IMAGE:-review-agent:local}
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: unless-stopped
    user: "10000:10000"
    entrypoint: ["/usr/local/bin/review-agent-github-app-worker"]
    depends_on:
      review-db-migrate:
        condition: service_completed_successfully
      review-github-gateway:
        condition: service_healthy
    environment:
      REVIEW_AGENT_DATABASE_URL: "${REVIEW_AGENT_DATABASE_URL:?set REVIEW_AGENT_DATABASE_URL}"
      REVIEW_AGENT_GITHUB_GATEWAY_URL: "http://review-github-gateway:8646"
      REVIEW_AGENT_PROFILE: "${REVIEW_AGENT_PROFILE:-sundsvall-standard}"
      REVIEW_AGENT_POLICY_REVISION: "${REVIEW_AGENT_POLICY_REVISION:-policy-v1}"
      REVIEW_AGENT_ACTIVE_JOB_LIMIT: "${REVIEW_AGENT_ACTIVE_JOB_LIMIT:-100}"
      REVIEW_AGENT_JOB_MAX_ATTEMPTS: "${REVIEW_AGENT_JOB_MAX_ATTEMPTS:-3}"
      REVIEW_AGENT_JOB_PRIORITY: "${REVIEW_AGENT_JOB_PRIORITY:-0}"
      REVIEW_AGENT_GITHUB_APP_POLL_SECONDS: "${REVIEW_AGENT_GITHUB_APP_POLL_SECONDS:-2}"
      REVIEW_AGENT_GITHUB_APP_RECOVERY_SECONDS: "${REVIEW_AGENT_GITHUB_APP_RECOVERY_SECONDS:-30}"
      REVIEW_AGENT_GITHUB_APP_RECOVERY_BATCH_SIZE: "${REVIEW_AGENT_GITHUB_APP_RECOVERY_BATCH_SIZE:-100}"
      REVIEW_AGENT_GITHUB_APP_DATABASE_BACKOFF_SECONDS: "${REVIEW_AGENT_GITHUB_APP_DATABASE_BACKOFF_SECONDS:-1}"
      REVIEW_AGENT_GITHUB_APP_DATABASE_BACKOFF_MAX_SECONDS: "${REVIEW_AGENT_GITHUB_APP_DATABASE_BACKOFF_MAX_SECONDS:-30}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      - review-database
      - review-github-control
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
          pids: 64
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  review-publisher:
    image: ${REVIEW_AGENT_IMAGE:-review-agent:local}
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: unless-stopped
    user: "10000:10000"
    entrypoint: ["/usr/local/bin/review-agent-publisher"]
    depends_on:
      review-db-migrate:
        condition: service_completed_successfully
      review-github-gateway:
        condition: service_healthy
    environment:
      REVIEW_AGENT_DATABASE_URL: "${REVIEW_AGENT_DATABASE_URL:?set REVIEW_AGENT_DATABASE_URL}"
      REVIEW_AGENT_GITHUB_GATEWAY_URL: "http://review-github-gateway:8646"
      REVIEW_AGENT_PUBLISH_MAX_BYTES: "${REVIEW_AGENT_PUBLISH_MAX_BYTES:-60000}"
      REVIEW_AGENT_PUBLICATION_LEASE_SECONDS: "${REVIEW_AGENT_PUBLICATION_LEASE_SECONDS:-120}"
      REVIEW_AGENT_PUBLICATION_HEARTBEAT_SECONDS: "${REVIEW_AGENT_PUBLICATION_HEARTBEAT_SECONDS:-30}"
      REVIEW_AGENT_PUBLICATION_RETRY_SECONDS: "${REVIEW_AGENT_PUBLICATION_RETRY_SECONDS:-30}"
      REVIEW_AGENT_PUBLICATION_POLL_SECONDS: "${REVIEW_AGENT_PUBLICATION_POLL_SECONDS:-2}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      - review-database
      - review-github-control
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    stop_grace_period: 150s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
          pids: 64
    logging:
      options:
        max-size: "10m"
        max-file: "5"

networks:
  review-ingress:
    external: true
    name: "${REVIEW_AGENT_INGRESS_NETWORK:-dokploy-network}"
  review-egress:
  review-database:
    internal: true
  review-runtime:
    internal: true
  review-github-egress:
  review-github-control:
    internal: true

volumes:
  hermes_review_data:
  review_postgres_data:

secrets:
  github_app_private_key:
    file: "${REVIEW_AGENT_GITHUB_APP_PRIVATE_KEY_PATH:-./secrets/github-app-private-key.pem}"
