name: Python bundle

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-fast:
    name: Python fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements.txt --requirement requirements-dev.txt

      - name: Install Pyright
        run: npm install --global pyright@1.1.408

      - name: Validate Python bundle
        run: ./scripts/check_bundle.sh

  postgres-contract:
    name: PostgreSQL contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Validate PostgreSQL contract
        run: ./scripts/check_postgres_schema.sh

  image-smoke:
    name: Image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Build and inspect container image
        run: |
          docker compose --env-file .env.example config --quiet
          docker build --tag review-agent:ci .
          bash ./scripts/check_image.sh review-agent:ci

  required:
    name: CI / required
    if: ${{ always() }}
    needs: [python-fast, postgres-contract, image-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm required jobs passed
        env:
          PYTHON_FAST_RESULT: ${{ needs.python-fast.result }}
          POSTGRES_RESULT: ${{ needs.postgres-contract.result }}
          IMAGE_RESULT: ${{ needs.image-smoke.result }}
        run: |
          test "$PYTHON_FAST_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$IMAGE_RESULT" = success
